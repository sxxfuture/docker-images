name: build postgres

on:
  push:
    branches: ["master"]
    paths:
      - postgres/**
      - .github/workflows/postgres.yml

jobs:
  build-images:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        pg_major: [17, 18]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Log in to the Container registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: ./postgres
          file: ./postgres/Dockerfile.${{ matrix.pg_major }}
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/postgres:${{ matrix.pg_major }}
            ghcr.io/${{ github.repository }}/postgres:${{ matrix.pg_major }}-${{ github.sha }}
          cache-from: type=gha,scope=postgres-${{ matrix.pg_major }}
          cache-to: type=gha,mode=max,scope=postgres-${{ matrix.pg_major }}
          platforms: linux/amd64
