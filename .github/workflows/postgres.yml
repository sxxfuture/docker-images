name: build postgres

on:
  push:
    branches: ["master"]
    paths:
      - postgres/**
      - .github/workflows/postgres.yml

jobs:
  build-images:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Log in to the Container registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Build and push all PostgreSQL images
        uses: docker/bake-action@v6
        with:
          workdir: ./postgres
          files: ./postgres/docker-bake.hcl
          targets: default
          push: true
          set: |
            *.cache-from=type=gha,scope=postgres-${{ matrix.postgres }}
            *.cache-to=type=gha,mode=max,scope=postgres-${{ matrix.postgres }}
